name: Refresh AI Updates
on:
  schedule:
    - cron: '23 21 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ai-updates
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: python -m unittest discover -s scripts -p 'test_ai_updates.py'
      - name: Fetch official feeds
        id: fetch
        continue-on-error: true
        run: python scripts/fetch-ai-updates.py
      - run: node scripts/verify-ai-updates.mjs
      - run: npm run build
      - name: Commit changed feed only
        run: |
          if ! git diff --quiet -- src/data/aiGuide/ai-updates.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add src/data/aiGuide/ai-updates.json
            git commit -m 'Refresh curated AI Updates'
            git push
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: website-with-ai-updates
          path: dist
      - name: Report total source failure
        if: steps.fetch.outcome == 'failure'
        run: exit 1
